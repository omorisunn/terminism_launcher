[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0"
repository = "https://github.com/omorisunn/terminism_launcher"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
rhai = { version = "1", features = ["serde", "metadata", "internals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
indextree = "4"
wasmi = "2"
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
